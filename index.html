<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사님 메일 이력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap">
<style>
  /* 색 · 글꼴 -------------------------------------------------------
     어두운 남색 바탕에 흰 글씨, 제목은 세리프. 값은 HSL 조각으로 두고
     쓸 때 hsl(var(--...))로 꺼내 씁니다. */
  :root {
    --background: 201 100% 13%;
    --foreground: 0 0% 100%;
    --muted-foreground: 240 4% 66%;
    --primary: 0 0% 100%;
    --primary-foreground: 0 0% 4%;
    --secondary: 0 0% 10%;
    --muted: 0 0% 10%;
    --accent: 0 0% 10%;
    --border: 0 0% 18%;
    --input: 0 0% 18%;

    /* 제목은 Instrument Serif, 한글은 명조 계열로 이어받습니다 */
    --font-display: 'Instrument Serif', 'Nanum Myeongjo', '바탕', Batang, serif;
    --font-body: 'Inter', 'Pretendard', 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif;

    /* 픽셀 캐릭터 색은 그대로 둡니다 */
    --skin: #f3cfae;
    --skin-dark: #dcb08c;
    --dot: #3a3f52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 0 72px;
    min-height: 100vh;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* 배경 영상 ------------------------------------------------------
     화면을 가득 채우고 계속 돌아갑니다. 위에 덧씌우는 막은 없고,
     깊이는 영상이 알아서 냅니다. 글은 모두 이 위에 올라갑니다. */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* 유리 효과 ------------------------------------------------------
     ::before가 테두리만 남기는 얇은 빛줄기를 그립니다 */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
      rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* 글이 담긴 칸은 모두 영상 위(z-index 10)에 놓입니다 */
  .nav, .wrap { position: relative; z-index: 10; }

  /* 위쪽 차림표 ----------------------------------------------------- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: hsl(var(--foreground));
    text-decoration: none;
  }
  .logo sup { font-size: 12px; }

  .nav-links { display: none; gap: 32px; }
  @media (min-width: 768px) { .nav-links { display: flex; } }

  .nav-links a {
    font-size: 14px;
    color: hsl(var(--muted-foreground));
    text-decoration: none;
    transition: color .2s ease;
  }
  .nav-links a:hover,
  .nav-links a.is-active { color: hsl(var(--foreground)); }

  .nav-cta {
    display: inline-block;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 14px;
    color: hsl(var(--foreground));
    text-decoration: none;
    transition: transform .2s ease;
  }
  .nav-cta:hover { transform: scale(1.03); }

  /* 제목 ------------------------------------------------------------ */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  .hero { text-align: center; padding: 72px 0 56px; }

  .notice {
    font-size: 13px;
    color: hsl(var(--muted-foreground));
    margin: 0 0 22px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(44px, 7.4vw, 86px);
    line-height: 0.95;
    letter-spacing: -2.46px;
    margin: 0;
  }
  /* 뒷말은 옅은 색으로 두어 앞말이 먼저 읽히게 합니다 */
  h1 em { font-style: normal; color: hsl(var(--muted-foreground)); }

  .sub {
    max-width: 42rem;
    margin: 26px auto 0;
    font-size: 17px;
    line-height: 1.7;
    color: hsl(var(--muted-foreground));
  }

  /* 두 칸 짜기: 왼쪽 목록 · 오른쪽 메일 --------------------------- */
  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 18px;
    align-items: start;
    padding-bottom: 40px;
  }

  /* 화면이 좁으면 목록이 위로 올라가고 메일이 아래에 놓입니다 */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* 영상이 밝은 자리에서도 글이 읽히도록 유리를 조금 더 두껍게 잡습니다.
     화면 전체에 덧씌우는 막은 쓰지 않고, 이 칸 안에서만 흐립니다. */
  .panel {
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.075);
    backdrop-filter: blur(24px) saturate(1.1);
    -webkit-backdrop-filter: blur(24px) saturate(1.1);
  }

  .panel-head {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    font-size: 13px;
    color: hsl(var(--muted-foreground));
  }

  /* 픽셀 아바타 --------------------------------------------------- */
  /* 도안은 하나입니다. 사람마다 --hair / --shirt 두 값만 바꿉니다.
     <use>는 shadow tree라 CSS 선택자가 안 닿으므로,
     도형에 fill="var(--hair)"를 직접 붙여 상속으로 칠합니다. */
  .avatar {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.10);
    padding: 3px;
    shape-rendering: crispEdges;
  }
  .avatar.sm { width: 34px; height: 34px; border-radius: 9px; padding: 2px; }
  .avatar.lg { width: 52px; height: 52px; border-radius: 12px; padding: 4px; }

  /* 왼쪽: 강사님 목록 --------------------------------------------- */
  .people { list-style: none; margin: 0; padding: 8px; }

  /* 한 줄에 아바타 + 성함 + 상태. 중간에 줄이 바뀌지 않게 합니다 */
  .person {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
  }
  .person + .person { margin-top: 2px; }
  .person:hover { background: rgba(255, 255, 255, 0.07); }
  .person:focus-visible { outline: 2px solid rgba(255, 255, 255, .55); outline-offset: -2px; }
  .person[aria-selected="true"] {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.22);
  }

  .p-name {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 500;
    color: hsl(var(--foreground));
  }

  /* 오른쪽: 고른 강사님 머리글 ------------------------------------ */
  .thread-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  }

  .th-text {
    min-width: 0;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .th-name {
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  .th-meta { font-size: 14px; color: hsl(var(--muted-foreground)); }

  /* 오른쪽: 메일 말풍선 ------------------------------------------- */
  .thread { padding: 20px 16px 6px; }

  .msg { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
  .msg.mine { justify-content: flex-end; }

  .msg-col { min-width: 0; max-width: 78%; }

  .msg-meta {
    margin: 0 0 5px;
    font-size: 12px;
    color: hsl(var(--muted-foreground));
  }
  .msg.mine .msg-meta { text-align: right; }

  .bubble {
    border-radius: 16px;
    padding: 12px 15px;
    background: rgba(255, 255, 255, 0.075);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  /* 내가 보낸 것은 한 칸 밝게 해서 눈으로 바로 갈립니다 */
  .msg.mine .bubble {
    background: rgba(255, 255, 255, 0.13);
    border-color: rgba(255, 255, 255, 0.20);
  }

  .b-subject {
    margin: 0 0 7px;
    font-size: 13px;
    font-weight: 500;
    color: hsl(var(--muted-foreground));
  }
  .b-line { margin: 0; font-size: 15px; word-break: keep-all; }
  .b-line + .b-line { margin-top: 2px; }

  /* 답장 초안 ------------------------------------------------------ */
  .draft {
    margin: 0 16px 18px;
    border-radius: 16px;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.05);
  }
  .draft-tag {
    margin: 0 0 8px;
    font-size: 12px;
    color: hsl(var(--muted-foreground));
  }
  .draft .b-line { line-height: 1.55; }

  /* 초안을 담는 칸. 눌러서 그대로 복사해 갑니다 */
  .draft-copy {
    display: block;
    width: 100%;
    resize: vertical;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 12px;
    padding: 12px 14px;
    background: hsl(var(--background) / .35);
    color: hsl(var(--foreground));
    font: inherit;
    font-size: 15px;
    line-height: 1.7;
    word-break: keep-all;
  }
  .draft-copy:focus { outline: 2px solid rgba(255, 255, 255, .5); outline-offset: 2px; }

  /* 잘 안 됐을 때 한 줄 */
  .draft-error {
    margin: 0;
    font-size: 14px;
    color: #f6ce97;
    word-break: keep-all;
  }

  .actions { padding: 0 16px 22px; text-align: center; }

  /* 이 화면에서 실제로 누르는 버튼은 이것 하나뿐이라,
     밝은 장면 위에서도 글자가 묻히지 않게 유리를 조금 더 채웁니다 */
  .draft-btn {
    font: inherit;
    font-size: 16px;
    border-radius: 999px;
    padding: 18px 52px;
    color: hsl(var(--foreground));
    cursor: pointer;
    background: hsl(var(--background) / .42);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .draft-btn:hover { background: hsl(var(--background) / .55); }

  .empty {
    padding: 72px 16px;
    text-align: center;
    color: hsl(var(--muted-foreground));
    font-size: 15px;
  }

  /* 상태 배지 ----------------------------------------------------- */
  .status {
    display: inline-block;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  /* 어두운 바탕에 맞춰 옅게 깔았을 뿐, 뜻하는 색은 그대로입니다 */
  /* 기다리는 상태 = 눈에 띄는 주황 */
  .st-wait    { background: rgba(245, 170, 60, .16);  color: #f6ce97; border-color: rgba(245, 170, 60, .38); }
  /* 조율 중 = 파랑 */
  .st-adjust  { background: rgba(120, 170, 255, .16); color: #c2d8fb; border-color: rgba(120, 170, 255, .38); }
  /* 확정 = 초록 */
  .st-done    { background: rgba(80, 210, 150, .15);  color: #b6e6cd; border-color: rgba(80, 210, 150, .36); }
  /* 종료 = 회색 */
  .st-closed  { background: rgba(255, 255, 255, .08); color: hsl(var(--muted-foreground)); border-color: rgba(255, 255, 255, .18); }

  .st-wait::before { content: "● "; }

  /* 움직임 ---------------------------------------------------------
     --i 는 "몇 번째"라는 뜻이고, 그만큼 늦게 움직이게 해서
     열두 명이 한꺼번에 말고 차례로 움직이도록 합니다. */

  /* 처음 들어올 때 아래에서 떠오릅니다 */
  @keyframes fade-rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-rise         { animation: fade-rise .8s ease-out both; }
  .animate-fade-rise-delay   { animation: fade-rise .8s ease-out .2s both; }
  .animate-fade-rise-delay-2 { animation: fade-rise .8s ease-out .4s both; }

  /* 픽셀 캐릭터가 숨 쉬듯 위아래로 조금씩 */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  .avatar {
    animation: bob 3.2s ease-in-out infinite;
    animation-delay: calc(var(--i, 0) * .17s);
  }

  /* 줄에 마우스를 올리면 그 사람만 폴짝 */
  @keyframes hop {
    0%   { transform: translateY(0)    rotate(0); }
    35%  { transform: translateY(-7px) rotate(-6deg); }
    70%  { transform: translateY(0)    rotate(3deg); }
    100% { transform: translateY(0)    rotate(0); }
  }
  .person { transition: background .15s ease, border-color .15s ease, transform .15s ease; }
  .person:hover { transform: translateX(3px); }
  .person:active { transform: translateX(3px) scale(.985); }
  .person:hover .avatar,
  .person:focus-visible .avatar { animation: hop .55s ease-in-out; }

  /* 고른 강사님 머리글: 아바타가 한 번 튀어나온 뒤 다시 숨을 쉽니다 */
  @keyframes pop {
    0%   { opacity: 0; transform: scale(.5) rotate(-10deg); }
    60%  { opacity: 1; transform: scale(1.12) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .thread-head .avatar {
    animation: pop .45s cubic-bezier(.2, .9, .3, 1.35) both,
               bob 3.2s ease-in-out .45s infinite;
  }
  .thread-head .th-text,
  .thread-head .status { animation: fade-in .45s .08s both; }

  /* 말풍선이 각자 제 쪽에서 하나씩 날아옵니다 */
  @keyframes in-left {
    from { opacity: 0; transform: translate(-16px, 10px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes in-right {
    from { opacity: 0; transform: translate(16px, 10px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  .msg {
    animation: in-left .4s cubic-bezier(.2, .8, .3, 1) both;
    animation-delay: calc(var(--i, 0) * .11s);
  }
  .msg.mine { animation-name: in-right; }

  /* 말풍선에 마우스를 올리면 살짝 떠오릅니다 */
  .bubble { transition: transform .18s ease, background .18s ease; }
  .msg:hover .bubble { transform: translateY(-2px); background: rgba(255, 255, 255, 0.10); }
  .msg.mine:hover .bubble { background: rgba(255, 255, 255, 0.17); }

  /* 기다리는 상태의 동그라미가 깜빡입니다 */
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  .st-wait::before { animation: blink 1.5s ease-in-out infinite; }

  /* 버튼 */
  .draft-btn { transition: transform .2s ease; }
  .draft-btn:hover { transform: scale(1.03); }
  .draft-btn:active { transform: scale(.98); }
  .draft-btn:focus-visible { outline: 2px solid rgba(255, 255, 255, .6); outline-offset: 3px; }
  .draft-btn.busy { pointer-events: none; }

  /* 초안을 쓰는 동안 점 세 개가 차례로 뜁니다 */
  @keyframes dot {
    0%, 75%, 100% { transform: translateY(0); opacity: .35; }
    35%           { transform: translateY(-6px); opacity: 1; }
  }
  .typing { display: flex; gap: 6px; padding: 4px 0 2px; }
  .typing i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: hsl(var(--foreground));
    animation: dot 1s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .30s; }

  /* 초안 상자는 아래에서 올라오고, 글은 한 줄씩 나타납니다 */
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  .draft { animation: rise .35s cubic-bezier(.2, .8, .3, 1) both; }
  .draft .b-line {
    animation: fade-in .3s both;
    animation-delay: calc(var(--i, 0) * .07s);
  }

  /* 움직임을 꺼 둔 분에게는 움직이지 않습니다 */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- 배경 영상: 소리 없이 계속 돌아갑니다 -->
<video class="bg-video" autoplay loop muted playsinline
       src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"></video>

<!-- 위쪽 차림표 -->
<nav class="nav animate-fade-rise">
  <a class="logo" href="#">Velorah<sup>®</sup></a>

  <div class="nav-links">
    <a href="#" class="is-active">Home</a>
    <a href="#">Studio</a>
    <a href="#">About</a>
    <a href="#">Journal</a>
    <a href="#">Reach Us</a>
  </div>

  <!-- 눌러서 하는 일은 없는 자리 표시라 버튼이 아니라 링크로 두었습니다.
       화면에서 실제로 누르는 버튼은 '답장 초안 만들기' 하나뿐입니다. -->
  <a class="nav-cta liquid-glass" href="#">Begin Journey</a>
</nav>

<div class="wrap">

  <div class="hero">
    <p class="notice animate-fade-rise">예시 자료로 만든 연습 화면입니다</p>
    <h1 class="animate-fade-rise">강사님 <em>메일 이력</em></h1>
    <p class="sub animate-fade-rise-delay">왼쪽에서 강사님을 고르면 그분과 주고받은 메일이 오른쪽에 말풍선으로 쌓입니다. 맨 아래 버튼을 누르면 답장 초안까지 한 번에 뜹니다.</p>
  </div>

  <!-- 픽셀 캐릭터 도안 ----------------------------------------------
       몸통 1개 + 머리 2종(짧은머리/긴머리) + 표정 5종을 겹쳐 씁니다.
       카드에서는 <use> 세 줄로 조합하고, 색은 --hair / --shirt 두 개만 바꿉니다. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <!-- 몸통: 얼굴 · 목 · 상의 (머리카락과 표정은 따로) -->
    <symbol id="p-body">
      <rect x="5"  y="6"  width="6" height="4" fill="var(--skin)"/>
      <rect x="7"  y="10" width="2" height="1" fill="var(--skin-dark)"/>
      <rect x="4"  y="11" width="8" height="5" fill="var(--shirt, #7fa7d8)"/>

<!-- 강사님 자료 --------------------------------------------------------
     02_instructors.csv의 열두 줄을 그대로 옮겨 놓은 것입니다.
     hair · shirt · hairStyle · face 네 값은 아바타 도안을 사람마다 다르게
     칠하기 위한 것이고, 도안 자체는 위의 <symbol> 하나를 모두가 같이 씁니다. -->
<script>
const INSTRUCTORS = [
  { name: "최유라", email: "yura.choi@example.com",     module: "M4 기획자를 위한 금융데이터 활용 실무", when: "9월 5일 (토) 10:00~17:00",  place: "마포 교육장", status: "강의안 회신 대기", hair: "#8a5a3b", shirt: "#e2a3a8", hairStyle: "hair-long",  face: "f-smile" },
  { name: "김도현", email: "dohyun.kim@example.com",    module: "M1 데이터 리터러시 기초",              when: "9월 3일 (목) 10:00~17:00",  place: "마포 교육장", status: "확정",            hair: "#2f2b2b", shirt: "#7fa7d8", hairStyle: "hair-short", face: "f-calm"  },
  { name: "박서연", email: "seoyeon.park@example.com",  module: "M2 금융 데이터 다루기",                when: "9월 4일 (금) 10:00~17:00",  place: "마포 교육장", status: "확정",            hair: "#5c4033", shirt: "#8fc9ae", hairStyle: "hair-long",  face: "f-happy" },
  { name: "이준호", email: "junho.lee@example.com",     module: "M3 리스크 데이터 이해",                when: "9월 11일 (목) 10:00~17:00", place: "강남 교육장", status: "일정 조율 중",     hair: "#3d3730", shirt: "#c2a5dd", hairStyle: "hair-short", face: "f-smile" },
  { name: "정민아", email: "mina.jung@example.com",     module: "M5 데이터 기반 서비스 기획",           when: "9월 12일 (금) 10:00~17:00", place: "마포 교육장", status: "확정",            hair: "#a8623c", shirt: "#f0c38b", hairStyle: "hair-long",  face: "f-wink"  },
  { name: "한지훈", email: "jihoon.han@example.com",    module: "M6 금융 규제와 데이터",                when: "9월 19일 (토) 09:30~16:30", place: "온라인",      status: "섭외 회신 대기",   hair: "#4b4237", shirt: "#7ec4c8", hairStyle: "hair-short", face: "f-calm"  },
  { name: "오세영", email: "seyoung.oh@example.com",    module: "M7 대시보드로 보고하기",               when: "9월 25일 (목) 10:00~17:00", place: "마포 교육장", status: "확정",            hair: "#6b4f2a", shirt: "#9ab8e8", hairStyle: "hair-long",  face: "f-smile" },
  { name: "배수민", email: "sumin.bae@example.com",     module: "M8 AI로 문서 자동화",                  when: "10월 2일 (목) 10:00~17:00", place: "강남 교육장", status: "강의안 회신 대기", hair: "#2b2f3a", shirt: "#e8a9c4", hairStyle: "hair-long",  face: "f-happy" },
  { name: "문태경", email: "taekyung.moon@example.com", module: "M9 데이터 시각화 실무",                when: "10월 10일 (금) 13:00~18:00", place: "온라인",     status: "일정 조율 중",     hair: "#7a4a2f", shirt: "#a8c98d", hairStyle: "hair-short", face: "f-oh"    },
  { name: "류해린", email: "haerin.ryu@example.com",    module: "M10 고객 데이터 분석",                 when: "10월 17일 (금) 10:00~17:00", place: "마포 교육장", status: "확정",           hair: "#c08552", shirt: "#8ec5e0", hairStyle: "hair-long",  face: "f-smile" },
  { name: "신도윤", email: "doyoon.shin@example.com",   module: "M11 실습 프로젝트 코칭",               when: "10월 24일 (금) 10:00~17:00", place: "마포 교육장", status: "섭외 회신 대기", hair: "#33302c", shirt: "#d8b06a", hairStyle: "hair-short", face: "f-calm"  },
  { name: "장예은", email: "yeeun.jang@example.com",    module: "M12 성과 측정과 리포팅",               when: "10월 31일 (금) 10:00~17:00", place: "강남 교육장", status: "종료",           hair: "#8d6b4f", shirt: "#b0b6c4", hairStyle: "hair-long",  face: "f-wink"  }
];

/* 상태마다 배지 색을 정해 둡니다 */
const STATUS_CLASS = {
  "강의안 회신 대기": "st-wait",
  "섭외 회신 대기":   "st-wait",
  "일정 조율 중":     "st-adjust",
  "확정":             "st-done",
  "종료":             "st-closed"
};

const $ = (id) => document.getElementById(id);
let picked = null;   /* 지금 고른 강사님. 아무도 안 골랐으면 null */

/* 글자를 그대로 화면에 넣기 위한 처리 */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* 아바타 하나를 그립니다. 도안은 하나, 색만 사람마다 다릅니다 */
function avatar(p, size) {
  return '<svg class="avatar ' + size + '" viewBox="0 0 16 16" aria-hidden="true"' +
         ' style="--hair:' + p.hair + '; --shirt:' + p.shirt + '">' +
         '<use href="#p-body"/><use href="#' + p.hairStyle + '"/><use href="#' + p.face + '"/></svg>';
}

function badge(status, extra) {
  return '<span class="status ' + STATUS_CLASS[status] + (extra || '') + '">' + esc(status) + '</span>';
}

/* 왼쪽 목록: 한 줄에 아바타 + 성함 + 상태 */
function drawList() {
  $("people").innerHTML = INSTRUCTORS.map(function (p, i) {
    return '<li class="person" role="option" tabindex="0" data-i="' + i + '" aria-selected="false"' +
           ' style="--i:' + i + '">' +
             avatar(p, "sm") +
             '<span class="p-name">' + esc(p.name) + '</span>' +
             badge(p.status) +
           '</li>';
  }).join("");
}

/* 오른쪽: 머리글 한 줄 + 오래된 메일부터 쌓은 말풍선 */
function drawThread(p) {
  $("threadHead").innerHTML =
    avatar(p, "lg") +
    '<span class="th-text">' +
      '<span class="th-name">' + esc(p.name) + '</span>' +
      '<span class="th-meta"> · ' + esc(p.module) + ' · ' + esc(p.when) + ' · ' + esc(p.place) + '</span>' +
    '</span>' +
    badge(p.status);

  const mails = THREADS[p.name] || [];
  $("thread").innerHTML = mails.map(function (m, i) {
    const mine = (m.from === "나");
    const who  = mine ? "나" : (p.name + " 강사님");
    const bubble =
      '<div class="msg-col">' +
        '<p class="msg-meta">' + esc(who) + ' · ' + esc(m.date) + '</p>' +
        '<div class="bubble">' +
          '<p class="b-subject">' + esc(m.subject) + '</p>' +
          m.lines.map(function (line) { return '<p class="b-line">' + esc(line) + '</p>'; }).join("") +
        '</div>' +
      '</div>';
    /* 강사님 말풍선은 왼쪽에 아바타를 붙이고, 내 말풍선은 오른쪽에 둡니다.
       --i 를 붙여 두면 위에서부터 차례로 하나씩 날아옵니다 */
    return mine
      ? '<div class="msg mine" style="--i:' + i + '">' + bubble + '</div>'
      : '<div class="msg" style="--i:' + i + '">' + avatar(p, "sm") + bubble + '</div>';
  }).join("");
}

/* 기다리는 동안: 앞에서 만든 점 세 개를 그대로 씁니다.
   이번에는 답이 올 때까지 계속 보입니다 */
function drawWaiting() {
  $("draftBox").innerHTML =
    '<div class="draft liquid-glass">' +
      '<p class="draft-tag">답장 초안 · 쓰는 중입니다</p>' +
      '<div class="typing"><i></i><i></i><i></i></div>' +
    '</div>';
}

/* 다 되면: 그대로 복사해 갈 수 있는 칸으로 보여줍니다.
   말풍선은 건드리지 않고 그 아래에 붙습니다 */
function drawDraft(text) {
  const lines = text.split("\n").length;
  $("draftBox").innerHTML =
    '<div class="draft liquid-glass">' +
      '<p class="draft-tag">답장 초안 · 칸을 누르면 전체가 잡힙니다</p>' +
      '<textarea class="draft-copy" readonly rows="' + lines + '"></textarea>' +
    '</div>';
  /* 글자는 값으로 넣습니다. 태그로 읽힐 일이 없습니다 */
  const box = $("draftBox").querySelector(".draft-copy");
  box.value = text;
  box.addEventListener("focus", function () { box.select(); });
}

/* 잘 안 되면: 무엇이 잘못됐는지 한 줄로 */
function drawError(why) {
  $("draftBox").innerHTML =
    '<div class="draft liquid-glass">' +
      '<p class="draft-error">초안을 받지 못했습니다 — ' + esc(why) + '</p>' +
    '</div>';
}

/* 강사님 한 분을 고릅니다. 초안은 지우고 처음 상태로 돌아갑니다 */
function pick(i) {
  picked = INSTRUCTORS[i];

  Array.prototype.forEach.call($("people").children, function (li, n) {
    li.setAttribute("aria-selected", n === i ? "true" : "false");
  });

  $("empty").hidden = true;
  $("threadWrap").hidden = false;
  $("draftBtn").classList.remove("busy");
  $("draftBox").innerHTML = "";
  drawThread(picked);
}

drawList();

$("people").addEventListener("click", function (e) {
  const li = e.target.closest(".person");
  if (li) pick(Number(li.dataset.i));
});

$("people").addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  const li = e.target.closest(".person");
  if (!li) return;
  e.preventDefault();
  pick(Number(li.dataset.i));
});

/* 버튼은 하나뿐입니다. 다시 눌러도 초안 하나가 새로 바뀔 뿐 쌓이지 않습니다.
   누르면 서버(/api/draft)에 말풍선을 통째로 보내고, 서버가 Gemini를 부릅니다.
   열쇠는 서버에만 있어 이 화면 소스에는 나오지 않습니다. */
$("draftBtn").addEventListener("click", async function () {
  if (!picked) return;
  const who = picked;

  $("draftBtn").classList.add("busy");
  drawWaiting();                      /* 답이 올 때까지 점 세 개가 계속 뜁니다 */

  try {
    const r = await fetch("/api/draft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name:   who.name,
        module: who.module,
        when:   who.when,
        place:  who.place,
        status: who.status,
        mails:  THREADS[who.name] || []
      })
    });

    const data = await r.json().catch(function () { return {}; });
    if (picked !== who) return;       /* 그 사이 다른 분을 골랐으면 그만둡니다 */

    if (!r.ok || !data.draft) {
      drawError(data.error || ("서버가 " + r.status + "로 답했습니다."));
    } else {
      drawDraft(data.draft);
    }
  } catch (e) {
    if (picked === who) drawError("서버에 닿지 못했습니다 (" + (e.message || e) + ")");
  } finally {
    if (picked === who) $("draftBtn").classList.remove("busy");
  }
});
</script>
